<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <title>Form a Story</title>
  </head>
  <body>
    <section id="top">
      <img src="https://content.codecademy.com/courses/learn-html-forms/formAStoryLogo.svg" alt="Form A Story Logo">
    </section>

    <section id="main">
      <h1>Complete the Form -<br> Complete the Story!</h1>
      <hr>
      <!--Add your form below:-->
      <form action="story.html" method="GET">
        <label for="animal-1">Animal:</label>
        <input type="text" id="animal-1" name="animal-1" value="dog" required minlength="3" maxlength="20"> 
        <br>
        <label for="animal-2">Animal:</label>
        <input type="text" id="animal-2" name="animal-2" value="cat" required minlength="3" maxlength="20">
        <br>
        <label for="animal-3">Animal:</label>
        <input type="text" id="animal-3" name="animal-3" value="ferret" required minlength="3" maxlength="20">
        <br>
        <label for="adj-1">Adjective (ends in -ed):</label>
        <input type="text" id="adj-1" name="adj-1" value="flattered" required pattern="[a-zA-Z]+ed">
        <br>
        <label for="verb-1">Verb (ends in -ing):</label>
        <input type="text" id="verb-1" name="verb-1" value="arriving" required pattern="[a-zA-Z]+ing">
        <br>
        <label for="num-1">Number:</label>
        <input type="number" id="num-1" name="num-1" value="69" required min="0" max="100">
        <br>
        <span>Yes or No:</span>
        <input type="radio" id="yes" name="answer" value="yes" required checked>
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="answer" value="no" required>
        <label for="no">No</label>
        <br>
        <label for="speed">Relative speed (ends in -er):</label>
        <select id="speed" name="speed" required>
          <option value="" selected disabled hidden>Choose speed</option>
          <option value="slower">Slower</option>
          <option value="faster">Faster</option>
        </select>
        <br>
        <label for="quote">Motivational Quote:</label>
        <input type="text" id="quote" name="quote" list="quote-choices" placeholder="winner winner!" required>
        <datalist id="quote-choices">
          <option value="winner gets ice cream!"></option>
          <option value="winner winner chicken dinner!"></option>
          <option value="winner takes all!"></option>
        </datalist>
        <br>
        <label for="message">Meaningful Message:</label>
        <textarea id="message" name="message" required rows="8" cols="40" placeholder="Type your message here"></textarea>
        <br>
        <input type="submit" value="Form My Story!">
      </form>
    </section>
  </body>
</html>
